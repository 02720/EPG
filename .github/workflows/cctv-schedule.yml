name: CCTV scheduled update

on:
  schedule:
    - cron: '30 16 * * *'    # 00:30 北京时间 = 16:30 UTC (前一日)
    - cron: '30 2 * * *'     # 10:30 北京时间 = 02:30 UTC
    - cron: '30 7 * * *'     # 15:30 北京时间 = 07:30 UTC
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CCTV branch
        uses: actions/checkout@v4
        with:
          ref: CCTV
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (if present)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run update script (if present)
        run: |
          if [ -x ./scripts/update_cctv.sh ]; then
            ./scripts/update_cctv.sh
          elif [ -f update_cctv.py ]; then
            python update_cctv.py
          else
            echo "No update script found — writing timestamp file"
            date -u > .cctv_updated
          fi

      - name: Commit & push changes back to CCTV
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Scheduled CCTV update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:CCTV
          fi
